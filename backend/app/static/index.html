                            <div className="flex items-center justify-between">
                              <span className="font-bold text-slate-900 text-xs">{entry.subject_code}</span>
                              <span className={`text-[9px] font-bold px-2 py-0.5 rounded ${
                                isLab ? "bg-amber-200 text-amber-900" : "bg-blue-200 text-blue-900"
                              }`}>
                                {isLab ? `LAB (${span} Periods Block)` : "THEORY"}
                              </span>
                            </div>
                            <div className="font-medium text-slate-800 text-xs mt-1">{entry.subject_name}</div>
                            <div className="flex items-center justify-between text-[11px] text-slate-500 mt-2 pt-1.5 border-t border-slate-200">
                              <span className="font-bold text-slate-700">🏛️ {entry.room_name}</span>
                              <span className="font-bold text-emerald-700">👨‍🏫 {(entry.faculty_short_names || []).join(", ") || "—"}</span>
                            </div>
                          </td>
                        );
                      } else {
                        // Empty period or fixed event
                        rowCells.push(
                          <td key={p} className="p-3 border-r border-slate-200 text-center text-slate-300 font-mono text-xs">
                            —
                          </td>
                        );
                      }
                    }

                    return (
                      <tr key={day} className="hover:bg-slate-50/50">
                        <td className="p-3 font-bold bg-slate-100/70 border-r border-slate-200 text-slate-800 text-center">
                          {day}
                        </td>
                        {rowCells}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. ALGORITHM VISUALIZER VIEW (Multi-Class Backtracking Playback)
    // =========================================================================
    function VisualizerView({ classes, currentTimetable }) {
      const [steps, setSteps] = useState([]);
      const [currentStepIdx, setCurrentStepIdx] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [speedMs, setSpeedMs] = useState(200);
      const [loading, setLoading] = useState(false);
      const [viewMode, setViewMode] = useState("multiclass");
      const timerRef = useRef(null);

      const fetchTrace = async () => {
        setLoading(true);
        try {
          const url = viewMode === "multiclass"
            ? `${API_BASE}/timetable/visualize/multiclass`
            : `${API_BASE}/timetable/visualize/${classes[0]?.id || "default"}`;
          const res = await fetch(url);
          const data = await res.json();
          setSteps(data.steps || []);
          setCurrentStepIdx(0);
        } catch (err) {
          console.error("Error fetching trace:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchTrace();
      }, [viewMode]);

      useEffect(() => {
        if (isPlaying) {
          timerRef.current = setInterval(() => {
            setCurrentStepIdx(prev => {
              if (prev < steps.length - 1) return prev + 1;
              setIsPlaying(false);
              return prev;
            });
          }, speedMs);
        } else if (timerRef.current) {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isPlaying, speedMs, steps.length]);

      const currentStep = steps[currentStepIdx] || null;

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="flex items-center space-x-2">
                <span className="px-2 py-0.5 bg-blue-600 text-white font-bold rounded text-[10px]">
                  DAA SEARCH ENGINE
                </span>
                <select
                  value={viewMode}
                  onChange={e => setViewMode(e.target.value)}
                  className="bg-slate-800 text-white text-xs font-bold p-1 rounded border border-slate-700 outline-none"
                >
                  <option value="multiclass">Multi-Class Simultaneous Solver</option>
                  <option value="single">Single Class Focus</option>
                </select>
              </div>
              <h2 className="text-xl font-bold mt-1 tracking-tight">Interactive Backtracking Visualizer</h2>
              <p className="text-xs text-slate-400 mt-1">
                Visualizes cross-class constraint checking: task selection (MRV), candidate testing (LCV), and conflict prunes.
              </p>
            </div>

            <div className="flex items-center space-x-2 bg-slate-800 p-2 rounded-xl border border-slate-700">
              <button
                onClick={() => setCurrentStepIdx(0)}
                className="p-2 hover:bg-slate-700 text-slate-300 rounded text-xs"
                title="Reset to start"
              >
                ⏮️
              </button>
              <button
                onClick={() => setCurrentStepIdx(Math.max(0, currentStepIdx - 1))}
                className="p-2 hover:bg-slate-700 text-slate-300 rounded text-xs"
                title="Step Backward"
              >
                ◀️
              </button>
              <button
                onClick={() => setIsPlaying(!isPlaying)}
                className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded text-xs shadow flex items-center space-x-1"
              >
                <span>{isPlaying ? "⏸️ Pause" : "▶️ Play"}</span>
              </button>
              <button
                onClick={() => setCurrentStepIdx(Math.min(steps.length - 1, currentStepIdx + 1))}
                className="p-2 hover:bg-slate-700 text-slate-300 rounded text-xs"
                title="Step Forward"
              >
                ▶️
              </button>
              <button
                onClick={() => setCurrentStepIdx(steps.length - 1)}
                className="p-2 hover:bg-slate-700 text-slate-300 rounded text-xs"
                title="Jump to end"
              >
                ⏭️
              </button>

              <div className="border-l border-slate-700 pl-2 ml-1 flex items-center space-x-1">
                <span className="text-[10px] text-slate-400">Speed:</span>
                <input
                  type="range" min="50" max="800" step="50"
                  value={speedMs}
                  onChange={e => setSpeedMs(parseInt(e.target.value))}
                  className="w-16 accent-blue-500"
                />
              </div>
            </div>
          </div>

          {/* Current Step Banner */}
          {currentStep && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-2 md:col-span-2">
                <div className="flex items-center justify-between">
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-bold text-slate-500 uppercase">Step #{currentStep.step_index + 1} of {steps.length}</span>
                    {currentStep.class_name && (
                      <span className="px-2 py-0.5 bg-blue-100 text-blue-800 rounded font-bold text-xs">
                        Class: {currentStep.class_name}
                      </span>
                    )}
                  </div>
                  <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${
                    currentStep.action === "ASSIGN" ? "bg-emerald-100 text-emerald-800" :
                    currentStep.action === "CONFLICT" ? "bg-rose-100 text-rose-800" :
                    currentStep.action === "BACKTRACK" ? "bg-amber-100 text-amber-800" :
                    currentStep.action === "COMPLETE" ? "bg-purple-100 text-purple-800" :
                    "bg-slate-100 text-slate-800"
                  }`}>
                    {currentStep.action}
                  </span>
                </div>

                <div className="text-base font-bold text-slate-900">
                  {currentStep.task_name}
                  {currentStep.duration > 1 && <span className="ml-2 text-xs text-amber-600">({currentStep.duration} Periods Consecutive Lab)</span>}
                </div>

                <div className="grid grid-cols-3 gap-2 pt-2 text-xs">
                  <div className="p-2 bg-slate-50 rounded-lg">
                    <span className="text-slate-400 block text-[10px]">Time Slot</span>
                    <span className="font-bold text-slate-700">{currentStep.day ? `${currentStep.day} P${currentStep.period}` : "Unassigned"}</span>
                  </div>
                  <div className="p-2 bg-slate-50 rounded-lg">
                    <span className="text-slate-400 block text-[10px]">Room</span>
                    <span className="font-bold text-slate-700">{currentStep.room_name || "N/A"}</span>
                  </div>
                  <div className="p-2 bg-slate-50 rounded-lg">
                    <span className="text-slate-400 block text-[10px]">Faculty</span>
                    <span className="font-bold text-slate-700">{(currentStep.faculty_names || []).join(", ") || "N/A"}</span>
                  </div>
                </div>

                {currentStep.reason && (
                  <div className={`p-3 rounded-lg text-xs font-medium border ${
                    currentStep.action === "CONFLICT" ? "bg-rose-50 border-rose-200 text-rose-800" : "bg-slate-50 border-slate-200 text-slate-700"
                  }`}>
                    {currentStep.reason}
                  </div>
                )}
              </div>

              {/* Algorithm Metrics */}
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400">Search Statistics</h4>
                <div className="space-y-2 text-xs">
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500">Tasks Assigned:</span>
                    <span className="font-bold text-emerald-600">{currentStep.current_assigned_count}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500">Backtracks Executed:</span>
                    <span className="font-bold text-amber-600">{currentStep.backtrack_count}</span>
                  </div>
                  <div className="flex justify-between py-1 border-b border-slate-100">
                    <span className="text-slate-500">Candidate Slots Tested:</span>
                    <span className="font-bold text-slate-700">{currentStep.tested_count}</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Decision Timeline Log */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <h3 className="font-bold text-slate-900 text-sm">Recent Solver Decision Events</h3>
            <div className="space-y-1.5 max-h-64 overflow-y-auto font-mono text-xs">
              {steps.slice(0, currentStepIdx + 1).slice(-15).reverse().map((st, i) => (
                <div key={i} className={`p-2 rounded flex items-center justify-between border ${
                  st.action === "ASSIGN" ? "bg-emerald-50/50 border-emerald-200 text-emerald-900" :
                  st.action === "CONFLICT" ? "bg-rose-50/50 border-rose-200 text-rose-900" :
                  st.action === "BACKTRACK" ? "bg-amber-50/50 border-amber-200 text-amber-900" :
                  "bg-slate-50 border-slate-200 text-slate-700"
                }`}>
                  <div className="flex items-center space-x-2 truncate">
                    <span className="font-bold">[{st.action}]</span>
                    {st.class_name && <span className="text-blue-700 font-bold">({st.class_name})</span>}
                    <span>{st.task_name}</span>
                    {st.day && <span>→ {st.day} P{st.period}</span>}
                  </div>
                  <span className="text-[10px] opacity-75 shrink-0 ml-2">{st.reason || ""}</span>
                </div>
              ))}
            </div>
          </div>

          {/* DAA Algorithmic Architecture Cards (Technical Implementation Details) */}
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div>
              <h3 className="font-bold text-slate-900 text-sm flex items-center space-x-2">
                <span>⚡</span>
                <span>DAA Constraint Satisfaction Problem (CSP) Engine Architecture</span>
              </h3>
              <p className="text-xs text-slate-500">
                Mathematical heuristics and pruning strategies applied by the backtracking scheduler to find globally conflict-free assignments.
              </p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
              <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                <div className="font-bold text-slate-800 flex items-center space-x-1.5">
                  <span className="w-2 h-2 rounded-full bg-blue-500"></span>
                  <span>MRV Heuristic (Minimum Remaining Values)</span>
                </div>
                <p className="text-slate-600 text-[11px] leading-relaxed">
                  Variables (teaching tasks) with the smallest number of valid slots are scheduled first. Multi-period laboratory blocks and shared instructors with tight availability are prioritized.
                </p>
              </div>
              <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                <div className="font-bold text-slate-800 flex items-center space-x-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  <span>LCV Ordering (Least Constraining Value)</span>
                </div>
                <p className="text-slate-600 text-[11px] leading-relaxed">
                  Candidate day and period slots are evaluated in an order that leaves the maximum number of allowable choices for parallel class sections and shared instructors.
                </p>
              </div>
              <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                <div className="font-bold text-slate-800 flex items-center space-x-1.5">
                  <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                  <span>Forward Checking & Pruning</span>
                </div>
                <p className="text-slate-600 text-[11px] leading-relaxed">
                  Whenever a subject is assigned to a period, overlapping timeslots for that class, assigned faculty, and room are immediately eliminated from all remaining tasks.
                </p>
              </div>
              <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                <div className="font-bold text-slate-800 flex items-center space-x-1.5">
                  <span className="w-2 h-2 rounded-full bg-purple-500"></span>
                  <span>Backtracking Search Tree</span>
                </div>
                <p className="text-slate-600 text-[11px] leading-relaxed">
                  Systematic depth-first exploration with rapid state restoration on dead-ends, ensuring complete constraint coverage and guaranteed zero resource collisions.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 9. DATA MANAGEMENT VIEW
    // =========================================================================
    function DataManagementView({ classes, subjects, faculty, rooms, refreshData, showAlert }) {
      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
            <div>
              <h2 className="text-lg font-bold text-slate-900">Institutional Database Directory</h2>
              <p className="text-xs text-slate-500">Direct overview of all entities registered in the database.</p>
            </div>
            <button
              onClick={refreshData}
              className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold border border-slate-300"
            >
              🔄 Refresh Tables
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Active Class Sections ({classes.length})</h3>
              <div className="divide-y divide-slate-100 max-h-60 overflow-y-auto text-xs">
                {classes.length === 0 ? (
                  <div className="py-4 text-center text-slate-400">No classes registered</div>
                ) : (
                  classes.map(c => (
                    <div key={c.id} className="py-2 flex justify-between">
                      <span className="font-semibold text-slate-800">{c.name}</span>
                      <span className="text-slate-500">{c.student_count} Students • {c.academic_year}</span>
                    </div>
                  ))
                )}
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Faculty Members ({faculty.length})</h3>
              <div className="divide-y divide-slate-100 max-h-60 overflow-y-auto text-xs">
                {faculty.length === 0 ? (
                  <div className="py-4 text-center text-slate-400">No faculty registered</div>
                ) : (
                  faculty.map(f => (
                    <div key={f.id} className="py-2 flex justify-between">
                      <span className="font-semibold text-slate-800">{f.name}</span>
                      <span className="px-2 py-0.5 bg-blue-100 text-blue-800 rounded font-bold">{f.short_name}</span>
                    </div>
                  ))
                )}
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Rooms & Laboratories ({rooms.length})</h3>
              <div className="divide-y divide-slate-100 max-h-60 overflow-y-auto text-xs">
                {rooms.length === 0 ? (
                  <div className="py-4 text-center text-slate-400">No rooms registered</div>
                ) : (
                  rooms.map(r => (
                    <div key={r.id} className="py-2 flex justify-between">
                      <span className="font-semibold text-slate-800">{r.name}</span>
                      <span className="text-slate-500">{r.type} ({r.capacity} seats)</span>
                    </div>
                  ))
                )}
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Registered Subjects ({subjects.length})</h3>
              <div className="divide-y divide-slate-100 max-h-60 overflow-y-auto text-xs">
                {subjects.length === 0 ? (
                  <div className="py-4 text-center text-slate-400">No subjects registered</div>
                ) : (
                  subjects.map(s => (
                    <div key={s.id} className="py-2 flex justify-between">
                      <span className="font-semibold text-slate-800">{s.course_code} - {s.name}</span>
                      <span className="text-slate-500">{s.periods_per_week} hrs/wk</span>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 10. CONSTRAINTS VIEW
    // =========================================================================
    function ConstraintsView({ faculty, refreshData, showAlert }) {
      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h2 className="text-lg font-bold text-slate-900">Constraint Engine & Mathematical Weights</h2>
            <p className="text-xs text-slate-500 mt-1">
              Antigravity Backtracking uses strict hard constraint filters and multi-objective soft evaluation.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Hard Constraints (Non-Negotiable)</h3>
              <div className="space-y-2 text-xs text-slate-600">
                <div className="p-2.5 bg-slate-50 rounded-lg">✓ Zero Cross-Class Faculty Double Booking</div>
                <div className="p-2.5 bg-slate-50 rounded-lg">✓ Zero Cross-Class Classroom Double Booking</div>
                <div className="p-2.5 bg-slate-50 rounded-lg">✓ Zero Class Schedule Overlaps</div>
                <div className="p-2.5 bg-slate-50 rounded-lg">✓ 3-Period Consecutive Same-Day Laboratory Blocks</div>
                <div className="p-2.5 bg-slate-50 rounded-lg">✓ Session Break Boundary Integrity (Recess & Lunch)</div>
                <div className="p-2.5 bg-slate-50 rounded-lg">✓ Room Capacity & Laboratory Type Enforcement</div>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
              <h3 className="font-bold text-slate-800 text-sm">Soft Optimization Penalties</h3>
              <div className="space-y-2 text-xs text-slate-600">
                <div className="p-2.5 bg-slate-50 rounded-lg">⚖️ Faculty Idle Gaps: Penalizes multi-period wait times between lectures</div>
                <div className="p-2.5 bg-slate-50 rounded-lg">⚖️ Student Gaps: Discourages holes in class section daily streams</div>
                <div className="p-2.5 bg-slate-50 rounded-lg">⚖️ Same-Day Repetition: Penalizes repeating the same theory subject multiple times in a day</div>
                <div className="p-2.5 bg-slate-50 rounded-lg">⚖️ Laboratory Timing: Favors afternoon slots for multi-period labs</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Mount React Root
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

  </script>
</body>
</html>
