          { class_name: "S6 CSE B", course_code: "CST 304", name: "Computer Networks", type: "THEORY", hours_per_week: 4, periods_per_week: 4, duration: 1, consecutive: false, requires_lab: false, faculty_shorts: ["VKR"] },

          { class_name: "S6 CSE B", course_code: "CSL 334", name: "Cloud & Systems Lab", type: "LAB", hours_per_week: 3, periods_per_week: 3, duration: 3, consecutive: true, requires_lab: true, required_lab_type: "CS_LAB", faculty_shorts: ["KRN", "MK"] }
        ],

        search_limit: 4000,
        optimization_enabled: true
      },
      two_classes_interdept: {
        classes: [
          { name: "S6 CSE", department_code: "CSE", department_name: "Computer Science", student_count: 60, academic_year: "2026-27", semester: "Even" },

        ],
        faculty: [

        ],

          { name: "Computing Center 1", type: "LAB", lab_type: "CS_LAB", capacity: 70, building: "Computing Wing" }
        ],
        subjects: [
          { class_name: "S6 CSE", course_code: "CST 302", name: "Compiler Design", type: "THEORY", hours_per_week: 4, periods_per_week: 4, duration: 1, consecutive: false, requires_lab: false, faculty_shorts: ["RK"] },
          { class_name: "S6 CSE", course_code: "CST 304", name: "Computer Networks", type: "THEORY", hours_per_week: 4, periods_per_week: 4, duration: 1, consecutive: false, requires_lab: false, faculty_shorts: ["PK"] },
          { class_name: "S6 CSE", course_code: "CSL 332", name: "Networking Lab", type: "LAB", hours_per_week: 3, periods_per_week: 3, duration: 3, consecutive: true, requires_lab: true, required_lab_type: "CS_LAB", faculty_shorts: ["RK", "PK"] },
          { class_name: "S4 ECE", course_code: "ECT 202", name: "Analog Circuits", type: "THEORY", hours_per_week: 4, periods_per_week: 4, duration: 1, consecutive: false, requires_lab: false, faculty_shorts: ["SV"] },
          { class_name: "S4 ECE", course_code: "ECT 204", name: "Signals & Systems", type: "THEORY", hours_per_week: 4, periods_per_week: 4, duration: 1, consecutive: false, requires_lab: false, faculty_shorts: ["DN"] },
          { class_name: "S4 ECE", course_code: "ECT 206", name: "Computer Architecture", type: "THEORY", hours_per_week: 4, periods_per_week: 4, duration: 1, consecutive: false, requires_lab: false, faculty_shorts: ["PK"] },
          { class_name: "S4 ECE", course_code: "ECL 202", name: "Analog Circuits Lab", type: "LAB", hours_per_week: 3, periods_per_week: 3, duration: 3, consecutive: true, requires_lab: true, required_lab_type: "HARDWARE_LAB", faculty_shorts: ["SV", "DN"] }
        ],
        fixed_events: [
          { name: "Technical Seminar", day: "Friday", period: 7, duration: 1, event_type: "COMMON_ACTIVITY", class_name: "ALL" }
        ],
        days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        periods: [1, 2, 3, 4, 5, 6, 7],
        soft_weights: { faculty_gap: 2.0, student_gap: 3.0, repetitions: 2.0, lab_afternoon: 1.5 },
        search_limit: 4000,
        optimization_enabled: true
      }
    };

    // =========================================================================
    // MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [classes, setClasses] = useState([]);
      const [subjects, setSubjects] = useState([]);
      const [faculty, setFaculty] = useState([]);
      const [rooms, setRooms] = useState([]);
      const [currentTimetable, setCurrentTimetable] = useState(null);
      const [timetableList, setTimetableList] = useState([]);
      const [loading, setLoading] = useState(false);
      const [alertMsg, setAlertMsg] = useState(null);
      const [validationModal, setValidationModal] = useState(null);
      const [generationSummaryModal, setGenerationSummaryModal] = useState(null);
      const [showMoreMenu, setShowMoreMenu] = useState(false);
      const [timetableViewMode, setTimetableViewMode] = useState("single");

      const fetchTimetableList = async () => {
        try {
          const res = await fetch(`${API_BASE}/timetable/list/all`);
          const data = await res.json();
          setTimetableList(data || []);
          if (data && data.length > 0 && !currentTimetable) {
            loadTimetableById(data[0].id);
          }
          return data;
        } catch (err) {
          console.error("Error fetching timetable list:", err);
          return [];
        }
      };

      const refreshData = async () => {
        try {
          const [cRes, sRes, fRes, rRes] = await Promise.all([
            fetch(`${API_BASE}/classes`).then(r => r.json()),
            fetch(`${API_BASE}/subjects`).then(r => r.json()),
            fetch(`${API_BASE}/faculty`).then(r => r.json()),
            fetch(`${API_BASE}/rooms`).then(r => r.json())
          ]);
          setClasses(cRes || []);
          setSubjects(sRes || []);
          setFaculty(fRes || []);
          setRooms(rRes || []);
          await fetchTimetableList();
        } catch (err) {
          console.error("Error refreshing data:", err);
        }
      };

      useEffect(() => {
        refreshData();
      }, []);

      const showAlert = (text, type = "success") => {
        setAlertMsg({ text, type });
        setTimeout(() => setAlertMsg(null), 5000);
      };

      const loadTimetableById = async (id) => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/timetable/${id}`);
          const data = await res.json();
          setCurrentTimetable(data);
          return data;
        } catch (err) {
          showAlert("Failed to load timetable", "error");
        } finally {
          setLoading(false);
        }
      };

      const loadExampleTemplate = async (templateKey = "three_classes_cs") => {
        setLoading(true);
        try {
          const payload = TEMPLATES[templateKey] || TEMPLATES.three_classes_cs;
          const res = await fetch(`${API_BASE}/timetable/wizard/setup-multiclass`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success) {
            await refreshData();
            if (data.classes && data.classes.length > 0) {
              await loadTimetableById(data.classes[0].timetable_id);
            }
            if (data.statistics) {
              setGenerationSummaryModal({
                stats: data.statistics,
                validation: data.validation,
                classes: data.classes || []
              });
            }
            showAlert("Example Academic Setup Loaded and Generated Successfully with 0 Conflicts!");
            setActiveTab("combined");
          } else {
            showAlert(data.message || "Failed to generate configuration", "error");
          }
        } catch (err) {
          showAlert("Error generating configuration", "error");
        } finally {
          setLoading(false);
        }
      };

      const resetData = async () => {
        if (!confirm("Are you sure you want to clear all active timetable records?")) return;
        setLoading(true);
        try {
          await fetch(`${API_BASE}/demo/reset`, { method: "POST" });
          setCurrentTimetable(null);
          await refreshData();
          showAlert("Institutional database cleared. You can now build a fresh schedule.", "info");
          setActiveTab("wizard");
        } catch (err) {
          showAlert("Failed to reset data", "error");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* Main Navigation Header */}
          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab("dashboard")}>
                  <div className="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-xl shadow-md">
                    TT
                  </div>
                  <div>
                    <h1 className="text-lg font-bold tracking-tight">SMART ACADEMIC TIMETABLE OPTIMIZER</h1>
                    <p className="text-xs text-slate-300 font-normal">Create conflict-free academic schedules with ease</p>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  <button
                    onClick={() => setActiveTab("wizard")}
                    className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-lg shadow flex items-center space-x-1.5 transition text-white"
                  >
                    <span>+ Create Timetable</span>
                  </button>
                  <button
                    onClick={() => loadExampleTemplate("three_classes_cs")}
                    disabled={loading}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 rounded-md border border-slate-700 transition flex items-center space-x-1"
                    title="Load an optional 3-class template for exploration"
                  >
                    <span>⚡ Load Example</span>
                  </button>
                  <button
                    onClick={resetData}
                    disabled={loading}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs text-slate-400 hover:text-slate-200 rounded-md border border-slate-700 transition"
                  >
                    Reset
                  </button>
                </div>
              </div>

              {/* Simplified Clean Navigation Bar */}
              <div className="flex items-center justify-between border-t border-slate-800 py-1 text-sm">
                <div className="flex space-x-1 overflow-x-auto">
                  {[
                    { id: "dashboard", label: "Dashboard", icon: "📊" },
                    { id: "wizard", label: "Create Timetable", icon: "➕" },
                    { id: "timetable", label: "Timetables", icon: "📅" },
                    { id: "faculty_view", label: "Faculty", icon: "👨‍🏫" },
                    { id: "room_view", label: "Rooms", icon: "🏛️" },
                    { id: "reports", label: "Reports", icon: "📑" }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => {
                        setShowMoreMenu(false);
                        setActiveTab(tab.id);
                      }}
                      className={`px-3.5 py-2 rounded-lg font-medium text-xs whitespace-nowrap transition flex items-center space-x-1.5 ${
                        activeTab === tab.id || (tab.id === "reports" && activeTab === "collision_report") || (tab.id === "timetable" && activeTab === "combined")
                          ? "bg-blue-600 text-white shadow"
                          : "text-slate-300 hover:bg-slate-800 hover:text-white"
                      }`}
                    >
                      <span>{tab.icon}</span>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </div>

                {/* More Dropdown (Secondary features: Visualizer, Data, Constraints) */}
                <div className="relative shrink-0 ml-2">
                  <button
                    onClick={() => setShowMoreMenu(!showMoreMenu)}
                    className={`px-3 py-2 rounded-lg font-medium text-xs whitespace-nowrap transition flex items-center space-x-1 ${
                      ["visualizer", "data", "constraints"].includes(activeTab)
                        ? "bg-slate-800 text-blue-300 border border-blue-500/40"
                        : "text-slate-400 hover:bg-slate-800 hover:text-white"
                    }`}
                  >
                    <span>⋯</span>
                    <span>More</span>
                    <span className="text-[9px]">▼</span>
                  </button>

                  {showMoreMenu && (
                    <div className="absolute right-0 mt-1 w-52 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1 z-50 text-xs animate-in fade-in zoom-in-95 duration-150">
                      <button
                        onClick={() => {
                          setActiveTab("visualizer");
                          setShowMoreMenu(false);
                        }}
                        className={`w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2 ${
                          activeTab === "visualizer" ? "text-blue-400 font-bold bg-slate-800/60" : "text-slate-200"
                        }`}
                      >
                        <span>🔍</span>
                        <div>
                          <div>Algorithm Visualization</div>
                          <div className="text-[10px] text-slate-400 font-normal">DAA Search Tree & CSP Solvers</div>
                        </div>
                      </button>
                      <button
                        onClick={() => {
                          setActiveTab("data");
                          setShowMoreMenu(false);
                        }}
                        className={`w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2 ${
                          activeTab === "data" ? "text-blue-400 font-bold bg-slate-800/60" : "text-slate-200"
                        }`}
                      >
                        <span>📁</span>
                        <div>
                          <div>Data Management</div>
                          <div className="text-[10px] text-slate-400 font-normal">Classes, Faculty, Rooms & DB</div>
                        </div>
                      </button>
                      <button
                        onClick={() => {
                          setActiveTab("constraints");
                          setShowMoreMenu(false);
                        }}
                        className={`w-full text-left px-3.5 py-2 hover:bg-slate-800 flex items-center space-x-2 ${
                          activeTab === "constraints" ? "text-blue-400 font-bold bg-slate-800/60" : "text-slate-200"
                        }`}
                      >
                        <span>⚙️</span>
                        <div>
                          <div>Settings & Scoring</div>
                          <div className="text-[10px] text-slate-400 font-normal">Soft constraints & penalties</div>
                        </div>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {alertMsg && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-lg shadow-xl text-sm font-medium flex items-center space-x-2 border ${
              alertMsg.type === "error"
                ? "bg-rose-50 text-rose-800 border-rose-200"
                : alertMsg.type === "info"
                ? "bg-amber-50 text-amber-800 border-amber-200"
                : "bg-emerald-50 text-emerald-800 border-emerald-200"
            }`}>
              <span>{alertMsg.type === "error" ? "❌" : "✅"}</span>
              <span>{alertMsg.text}</span>
            </div>
          )}

          {/* Active View Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {activeTab === "dashboard" && (
              <DashboardView
                classes={classes}
                subjects={subjects}
                faculty={faculty}
                rooms={rooms}
                timetableList={timetableList}
                currentTimetable={currentTimetable}
                loadTimetableById={loadTimetableById}
                loadExampleTemplate={loadExampleTemplate}
                setActiveTab={setActiveTab}
                setTimetableViewMode={setTimetableViewMode}
              />
            )}
            {activeTab === "wizard" && (
              <CreateTimetableWizard
                refreshData={refreshData}
                setCurrentTimetable={setCurrentTimetable}
                setActiveTab={setActiveTab}
                showAlert={showAlert}
                loadTimetableById={loadTimetableById}
                setGenerationSummaryModal={setGenerationSummaryModal}
              />
            )}
            {(activeTab === "combined" || (activeTab === "timetable" && timetableViewMode === "all")) && (
              <CombinedAllClassesView
                classes={classes}
                showAlert={showAlert}
                setActiveTab={setActiveTab}
                loadTimetableById={loadTimetableById}
                setTimetableViewMode={setTimetableViewMode}
              />
            )}
            {activeTab === "timetable" && timetableViewMode === "single" && (
              <TimetableView
                timetable={currentTimetable}
                timetableList={timetableList}
                loadTimetableById={loadTimetableById}
                setCurrentTimetable={setCurrentTimetable}
                setActiveTab={setActiveTab}
                setValidationModal={setValidationModal}
                showAlert={showAlert}
                setTimetableViewMode={setTimetableViewMode}
              />
            )}
            {activeTab === "faculty_view" && (
              <FacultyScheduleView
                faculty={faculty}
                showAlert={showAlert}
              />
            )}
            {activeTab === "room_view" && (
              <RoomAllocationView
                rooms={rooms}
                showAlert={showAlert}
              />
            )}
            {(activeTab === "reports" || activeTab === "collision_report") && (
              <ReportsView
                classes={classes}
                faculty={faculty}
                rooms={rooms}
                timetableList={timetableList}
                currentTimetable={currentTimetable}
                showAlert={showAlert}
                setActiveTab={setActiveTab}
              />
            )}
            {activeTab === "visualizer" && (
              <VisualizerView
                classes={classes}
                currentTimetable={currentTimetable}
              />
            )}
            {activeTab === "data" && (
              <DataManagementView
                classes={classes}
                subjects={subjects}
                faculty={faculty}
                rooms={rooms}
                refreshData={refreshData}
                showAlert={showAlert}
              />
            )}
            {activeTab === "constraints" && (
              <ConstraintsView
                faculty={faculty}
                refreshData={refreshData}
                showAlert={showAlert}
              />
            )}
          </main>

          {/* GENERATION SUMMARY & METRICS MODAL */}

    // 2. MULTI-CLASS SETUP WIZARD (8 STEPS)
    // =========================================================================
    function CreateTimetableWizard({ refreshData, setCurrentTimetable, setActiveTab, showAlert, loadTimetableById, setGenerationSummaryModal }) {
      const [step, setStep] = useState(1);
      const [loading, setLoading] = useState(false);

      // Clean blank configuration state by default (no forced presets)
      const [config, setConfig] = useState(() => JSON.parse(JSON.stringify(DEFAULT_BLANK_CONFIG)));
      const [activeClassTab, setActiveClassTab] = useState(0);

      const applyTemplate = (templateKey) => {
        if (TEMPLATES[templateKey]) {
          setConfig(JSON.parse(JSON.stringify(TEMPLATES[templateKey])));
          setActiveClassTab(0);
          showAlert(`Loaded example template! You can modify any details.`);
        }
      };

      const resetToBlank = () => {
        setConfig(JSON.parse(JSON.stringify(DEFAULT_BLANK_CONFIG)));
        setActiveClassTab(0);
        showAlert("Reset to fresh blank slate.", "info");
      };

      // Step 1: Class Count Management
      const setClassCount = (cnt) => {
        const count = Math.max(1, Math.min(10, cnt));
        const currentClasses = [...config.classes];
        if (count > currentClasses.length) {
          for (let i = currentClasses.length; i < count; i++) {
            currentClasses.push({
              name: `Class ${i + 1}`,
              department_code: "DEPT",
              department_name: "Department",
              student_count: 60,
              academic_year: "2026-27",
              semester: "Odd"
            });
          }
        } else if (count < currentClasses.length) {
          currentClasses.splice(count);
        }
        setConfig({ ...config, classes: currentClasses });
        if (activeClassTab >= count) setActiveClassTab(0);
      };

      // Step 3: Faculty Helper
      const [newFac, setNewFac] = useState({ name: "", short_name: "", email: "" });
      const addFaculty = () => {
        if (!newFac.name.trim() || !newFac.short_name.trim()) {
          showAlert("Please enter faculty name and short initials", "error");
          return;
        }
        const updated = [...config.faculty, {
          name: newFac.name.trim(),
          short_name: newFac.short_name.trim().toUpperCase(),
          email: newFac.email.trim()
        }];
        setConfig({ ...config, faculty: updated });
        setNewFac({ name: "", short_name: "", email: "" });
      };
      const removeFaculty = (idx) => {
        const facToRemove = config.faculty[idx].short_name;
        const updatedFac = config.faculty.filter((_, i) => i !== idx);
        const updatedSub = config.subjects.map(s => ({
          ...s,
          faculty_shorts: (s.faculty_shorts || []).filter(sh => sh !== facToRemove)
        }));
        setConfig({ ...config, faculty: updatedFac, subjects: updatedSub });
      };

      // Step 4: Room Helper
      const [newRoom, setNewRoom] = useState({ name: "", type: "THEORY", lab_type: "", capacity: 60, building: "Academic Wing" });
      const addRoom = () => {
        if (!newRoom.name.trim()) {
          showAlert("Please enter room name", "error");
          return;
        }
        const updated = [...config.rooms, {
          name: newRoom.name.trim(),
          type: newRoom.type,
          lab_type: newRoom.type === "LAB" ? (newRoom.lab_type.trim() || "CS_LAB") : null,
          capacity: parseInt(newRoom.capacity) || 60,
          building: newRoom.building.trim() || "Academic Wing"
        }];
        setConfig({ ...config, rooms: updated });
        setNewRoom({ name: "", type: "THEORY", lab_type: "", capacity: 60, building: "Academic Wing" });
      };
      const removeRoom = (idx) => {
        setConfig({ ...config, rooms: config.rooms.filter((_, i) => i !== idx) });
      };

      // Step 5: Subject Helper per Class
      const currentClassName = config.classes[activeClassTab]?.name || "";
      const [newSub, setNewSub] = useState({
        course_code: "",
        name: "",
        type: "THEORY",
        hours_per_week: 4,
        periods_per_week: 4,
        duration: 1,
        consecutive: false,
        requires_lab: false,
        required_lab_type: "CS_LAB",
        faculty_shorts: []
      });
      const addSubject = () => {
        if (!newSub.course_code.trim() || !newSub.name.trim()) {
          showAlert("Please enter Course Code and Subject Name", "error");
          return;
        }
        const isLab = newSub.type === "LAB" || newSub.requires_lab;
        const hours = parseInt(newSub.hours_per_week) || parseInt(newSub.periods_per_week) || (isLab ? 3 : 4);
        const dur = parseInt(newSub.duration) || (isLab ? 3 : 1);
        const isConsecutive = isLab || !!newSub.consecutive;
        const subToAdd = {
          class_name: currentClassName,
          course_code: newSub.course_code.trim().toUpperCase(),
          name: newSub.name.trim(),
          type: isLab ? "LAB" : newSub.type,
          hours_per_week: hours,
          periods_per_week: hours,
          duration: dur,
          consecutive: isConsecutive,
          requires_lab: isLab,
          required_lab_type: isLab ? (newSub.required_lab_type || "CS_LAB") : null,
          faculty_shorts: [...newSub.faculty_shorts]
        };
        setConfig({ ...config, subjects: [...config.subjects, subToAdd] });
        setNewSub({
          course_code: "",
          name: "",
          type: "THEORY",
          hours_per_week: 4,
          periods_per_week: 4,
          duration: 1,
          consecutive: false,
          requires_lab: false,
          required_lab_type: "CS_LAB",
          faculty_shorts: []
        });
      };
      const removeSubject = (idx) => {
        setConfig({ ...config, subjects: config.subjects.filter((_, i) => i !== idx) });
      };

      // Step 6: Fixed Events Helper
      const [newFe, setNewFe] = useState({ name: "Department Activity", day: "Friday", period: 7, duration: 1, event_type: "COMMON_ACTIVITY", class_name: "ALL" });
      const addFixedEvent = () => {
        if (!newFe.name.trim()) {
          showAlert("Please enter event name", "error");
          return;
        }
        setConfig({
          ...config,
          fixed_events: [...config.fixed_events, {
            name: newFe.name.trim(),
            day: newFe.day,
            period: parseInt(newFe.period) || 7,
            duration: parseInt(newFe.duration) || 1,
            event_type: newFe.event_type,
            class_name: newFe.class_name || "ALL"
          }]
        });
        setNewFe({ name: "", day: "Friday", period: 7, duration: 1, event_type: "COMMON_ACTIVITY", class_name: "ALL" });
      };
      const removeFixedEvent = (idx) => {
        setConfig({ ...config, fixed_events: config.fixed_events.filter((_, i) => i !== idx) });
      };

      // Final Submission: Simultaneous Multi-Class Solve
      const handleGenerateAll = async () => {
        // Validation check
        if (config.classes.length === 0) {
          showAlert("Please configure at least one class", "error");
          return;
        }
        if (config.subjects.length === 0) {
          showAlert("Please add at least one subject", "error");
          return;
        }
        if (config.rooms.length === 0) {
          showAlert("Please add at least one room", "error");
          return;
        }

        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/timetable/wizard/setup-multiclass`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(config)
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            const detailMsg = errData.detail 
              ? (typeof errData.detail === "string" ? errData.detail : JSON.stringify(errData.detail)) 
              : (errData.message || `Server responded with HTTP ${res.status}`);
            showAlert(`Scheduler Error: ${detailMsg}`, "error");
            return;
          }
          const data = await res.json();
          if (data.success) {
            try { await refreshData(); } catch (e) { console.warn("refreshData error:", e); }
            if (data.classes && data.classes.length > 0) {
              try { await loadTimetableById(data.classes[0].timetable_id); } catch (e) { console.warn("loadTimetable error:", e); }
            }
            if (data.statistics && typeof setGenerationSummaryModal === "function") {
              setGenerationSummaryModal({
                stats: data.statistics,
                validation: data.validation,
                classes: data.classes || []
              });
            }
            showAlert(data.message || "All timetables generated successfully with 0 conflicts!");
            setActiveTab("combined");
          } else {
            const topReasons = data.diagnostics?.top_failure_reasons;
            let reasonStr = "";
            if (topReasons && Object.keys(topReasons).length > 0) {
              reasonStr = Object.entries(topReasons).map(([r, c]) => `${r} (${c})`).join("; ");
            }
            showAlert((data.message || "Scheduling was unsuccessful") + (reasonStr ? ` — Reasons: ${reasonStr}` : ""), "error");
          }
        } catch (err) {
          console.error("Scheduler API communication error:", err);
          const isNetworkError = err.message && (err.message.includes("fetch") || err.message.includes("NetworkError") || err.message.includes("Failed to fetch"));
          const errorMsg = isNetworkError 
            ? "Cannot connect to the scheduling service. Please check your network connection or ensure the service is running."
            : `Failed to communicate with scheduler API: ${err.message}`;
          showAlert(errorMsg, "error");
        } finally {
          setLoading(false);
        }
      };

      const stepsList = [
        { num: 1, title: "Classes", icon: "🔢" },
        { num: 2, title: "Class Details", icon: "🎓" },
        { num: 3, title: "Faculty", icon: "👨‍🏫" },
        { num: 4, title: "Rooms & Labs", icon: "🏛️" },
        { num: 5, title: "Subjects", icon: "📚" },
        { num: 6, title: "Fixed Events", icon: "⏰" },
        { num: 7, title: "Constraints", icon: "⚙️" },
        { num: 8, title: "Review & Generate", icon: "🚀" }
      ];

      return (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          {/* Wizard Header & Steps Progress */}
          <div className="bg-slate-900 text-white p-6 border-b border-slate-800">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <span className="text-[10px] font-bold tracking-wider bg-blue-600/30 text-blue-300 px-2.5 py-0.5 rounded border border-blue-400/30 uppercase">
                  Simultaneous Multi-Class Engine
                </span>
                <h2 className="text-xl font-bold mt-1">Academic Timetable Setup Wizard</h2>
                <p className="text-xs text-slate-400">Configure 1 or multiple classes and solve as a unified CSP with zero cross-class collisions.</p>
              </div>

              {/* Template Buttons (Optional) */}
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  onClick={() => applyTemplate("three_classes_cs")}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs border border-slate-700 font-semibold"
                  title="Load 3-Class CS example"
                >
                  ⚡ Template: 3 Classes
                </button>
                <button
                  type="button"
                  onClick={() => applyTemplate("two_classes_interdept")}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded text-xs border border-slate-700 font-semibold"
                  title="Load 2-Class interdepartmental example"
                >
                  ⚡ Template: 2 Classes
                </button>
                <button
                  type="button"
                  onClick={resetToBlank}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 rounded text-xs border border-slate-700 font-semibold"
                  title="Clear all fields and start fresh"
                >
                  🗑️ Fresh Blank
                </button>
              </div>
            </div>

            {/* Stepper Navigation */}
            <div className="grid grid-cols-4 md:grid-cols-8 gap-2 pt-6">
              {stepsList.map(s => (
                <button
                  key={s.num}
                  type="button"
                  onClick={() => setStep(s.num)}
                  className={`p-2 rounded-xl text-center transition flex flex-col items-center space-y-1 ${
                    step === s.num
                      ? "bg-blue-600 text-white shadow-md font-bold"
                      : step > s.num
                      ? "bg-slate-800/80 text-emerald-400 font-medium hover:bg-slate-800"
                      : "bg-slate-800/40 text-slate-400 hover:bg-slate-800"
                  }`}
                >
                  <span className="text-sm">{s.icon}</span>
                  <span className="text-[11px] leading-tight line-clamp-1">{s.title}</span>
                </button>
              ))}
            </div>
          </div>

          <div className="p-6 md:p-8 space-y-6">
            {/* STEP 1: CLASS COUNT */}
            {step === 1 && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <div className="text-center space-y-2">
                  <span className="text-3xl">🔢</span>
                  <h3 className="text-lg font-bold text-slate-800">Step 1: Number of Classes to Schedule</h3>
                  <p className="text-xs text-slate-500">
                    How many classes / sections need to be scheduled? Whether you have 1 class or 10, all will be solved with zero resource collisions.
                  </p>
                </div>

                <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 flex flex-col items-center justify-center space-y-4">
                  <div className="text-xs font-bold uppercase tracking-wider text-slate-500">Total Classes</div>
                  <div className="flex items-center space-x-4">
                    <button
                      type="button"
                      onClick={() => setClassCount(config.classes.length - 1)}
                      disabled={config.classes.length <= 1}
                      className="w-12 h-12 rounded-xl bg-white border border-slate-300 text-slate-800 font-black text-xl hover:bg-slate-100 disabled:opacity-40 shadow-sm"
                    >
                      -
                    </button>
                    <span className="text-4xl font-black text-blue-600 w-16 text-center">{config.classes.length}</span>
                    <button
                      type="button"
                      onClick={() => setClassCount(config.classes.length + 1)}
                      disabled={config.classes.length >= 10}
                      className="w-12 h-12 rounded-xl bg-white border border-slate-300 text-slate-800 font-black text-xl hover:bg-slate-100 disabled:opacity-40 shadow-sm"
                    >
                      +
                    </button>
                  </div>
                  <p className="text-xs text-slate-500">Schedule 1 single class or up to 10 classes in one unified batch.</p>
                </div>

                <div className="space-y-2">
                  <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500">Classes Configured in this Batch:</h4>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    {config.classes.map((c, i) => (
                      <div key={i} className="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between shadow-xs">
                        <span className="text-xs font-bold text-slate-800">{c.name || `Class ${i+1}`}</span>
                        <span className="text-[10px] bg-blue-100 text-blue-800 font-bold px-1.5 py-0.5 rounded">{c.department_code || "DEPT"}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* STEP 2: CLASS DETAILS */}
            {step === 2 && (
              <div className="space-y-6">
                <div>
                  <h3 className="text-base font-bold text-slate-800 flex items-center space-x-2">
                    <span>🎓</span>
                    <span>Step 2: Class & Section Details</span>
                  </h3>
                  <p className="text-xs text-slate-500">Customize the department, academic year, and student size for each class section.</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {config.classes.map((cls, idx) => (
                    <div key={idx} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                      <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span className="text-xs font-bold text-blue-700">Class #{idx + 1}</span>
                        <span className="text-[10px] bg-slate-200 text-slate-700 px-2 py-0.5 rounded font-bold">{cls.name || "Untitled"}</span>
                      </div>
                      <div className="space-y-2">
                        <div>
                          <label className="text-[11px] font-bold text-slate-600 block">Class Name</label>
                          <input
                            type="text"
                            value={cls.name}
                            onChange={e => {
                              const oldName = cls.name;
                              const newName = e.target.value;
                              const updatedClasses = [...config.classes];
                              updatedClasses[idx].name = newName;
                              const updatedSubjects = config.subjects.map(s => s.class_name === oldName ? { ...s, class_name: newName } : s);
                              setConfig({ ...config, classes: updatedClasses, subjects: updatedSubjects });
                            }}
                            placeholder="e.g. S3 Mechanical, S5 AIML"
                            className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs font-semibold"
                          />
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="text-[11px] font-bold text-slate-600 block">Dept Code</label>
                            <input
                              type="text"
                              value={cls.department_code}
                              onChange={e => {
                                const updated = [...config.classes];
                                updated[idx].department_code = e.target.value.toUpperCase();
                                setConfig({ ...config, classes: updated });
                              }}
                              className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs font-semibold"
                            />
                          </div>
                          <div>
                            <label className="text-[11px] font-bold text-slate-600 block">Student Count</label>
                            <input
                              type="number"
                              value={cls.student_count}
                              onChange={e => {
                                const updated = [...config.classes];
                                updated[idx].student_count = parseInt(e.target.value) || 60;
                                setConfig({ ...config, classes: updated });
                              }}
                              className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs"
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* STEP 3: SHARED FACULTY */}
            {step === 3 && (
              <div className="space-y-6">
                <div>
                  <h3 className="text-base font-bold text-slate-800 flex items-center space-x-2">
                    <span>👨‍🏫</span>
                    <span>Step 3: Shared Institutional Faculty Directory</span>
                  </h3>
                  <p className="text-xs text-slate-500">
                    Faculty in this directory can teach courses across any configured class. The solver guarantees no instructor is double-booked across sections.
                  </p>
                </div>

                {/* Add Faculty Form */}
                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
                  <div className="sm:col-span-2">
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Full Name</label>
                    <input
                      type="text"
                      value={newFac.name}
                      onChange={e => setNewFac({ ...newFac, name: e.target.value })}
                      placeholder="e.g. Dr. Arun Kumar P"
                      className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Short Code / Initials</label>
                    <input
                      type="text"
                      value={newFac.short_name}
                      onChange={e => setNewFac({ ...newFac, short_name: e.target.value.toUpperCase() })}
                      placeholder="e.g. AKP"
                      className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs uppercase font-bold"
                    />
                  </div>
                  <button
                    type="button"
                    onClick={addFaculty}
                    className="p-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xs shadow"
                  >
                    + Add Faculty
                  </button>
                </div>

                {/* Faculty Table */}
                <div className="border border-slate-200 rounded-xl overflow-hidden">
                  <table className="w-full text-xs text-left">
                    <thead className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <tr>
                        <th className="p-3">#</th>
                        <th className="p-3">Short Code</th>
                        <th className="p-3">Faculty Name</th>
                        <th className="p-3">Email</th>
                        <th className="p-3 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {config.faculty.length === 0 ? (
                        <tr>
                          <td colSpan="5" className="p-6 text-center text-slate-400 font-medium">
                            No faculty added yet. Use the form above to register instructors.
                          </td>
                        </tr>
                      ) : (
                        config.faculty.map((f, i) => (
                          <tr key={i} className="hover:bg-slate-50">
                            <td className="p-3 text-slate-400 font-medium">{i + 1}</td>
                            <td className="p-3">
                              <span className="px-2 py-0.5 bg-blue-100 text-blue-800 font-bold rounded text-[11px]">{f.short_name}</span>
                            </td>
                            <td className="p-3 font-semibold text-slate-800">{f.name}</td>
                            <td className="p-3 text-slate-500">{f.email || "N/A"}</td>
                            <td className="p-3 text-right">
                              <button
                                type="button"
                                onClick={() => removeFaculty(i)}
                                className="text-rose-600 hover:text-rose-800 font-bold text-xs"
                              >
                                ✕ Remove
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* STEP 4: ROOMS & LABS */}
            {step === 4 && (
              <div className="space-y-6">
                <div>
                  <h3 className="text-base font-bold text-slate-800 flex items-center space-x-2">
                    <span>🏛️</span>
                    <span>Step 4: Classrooms & Laboratories Directory</span>
                  </h3>
                  <p className="text-xs text-slate-500">
                    Define classrooms and laboratories. Classrooms are theory rooms and labs are specialized for laboratory sessions. Rooms will not be double-booked across classes.
                  </p>
                </div>

                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-5 gap-3 items-end">
                  <div className="sm:col-span-2">
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Room Name / No.</label>
                    <input
                      type="text"
                      value={newRoom.name}
                      onChange={e => setNewRoom({ ...newRoom, name: e.target.value })}
                      placeholder="e.g. Room 101, Computing Lab 1"
                      className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Type</label>
                    <select
                      value={newRoom.type}
                      onChange={e => setNewRoom({ ...newRoom, type: e.target.value })}
                      className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs font-semibold"
                    >
                      <option value="THEORY">Theory Classroom</option>
                      <option value="LAB">Laboratory</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[11px] font-bold text-slate-600 block mb-1">Capacity</label>
                    <input
                      type="number"
                      value={newRoom.capacity}
                      onChange={e => setNewRoom({ ...newRoom, capacity: e.target.value })}
                      className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs"
                    />
                  </div>
                  <button
                    type="button"
                    onClick={addRoom}
                    className="p-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xs shadow"
                  >
                    + Add Room
                  </button>
                </div>

                <div className="border border-slate-200 rounded-xl overflow-hidden">
                  <table className="w-full text-xs text-left">
                    <thead className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <tr>
                        <th className="p-3">#</th>
                        <th className="p-3">Room Name</th>
                        <th className="p-3">Type</th>
                        <th className="p-3">Capacity</th>
                        <th className="p-3 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {config.rooms.length === 0 ? (
                        <tr>
                          <td colSpan="5" className="p-6 text-center text-slate-400 font-medium">
                            No rooms added yet. Please add at least one classroom.
                          </td>
                        </tr>
                      ) : (
                        config.rooms.map((r, i) => (
                          <tr key={i} className="hover:bg-slate-50">
                            <td className="p-3 text-slate-400 font-medium">{i + 1}</td>
                            <td className="p-3 font-semibold text-slate-800">{r.name}</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${

                                ✕ Remove

            {step === 5 && (
              <div className="space-y-6">

                    <span>Step 5: Subject Allocation per Class</span>

    // 4. FACULTY SCHEDULE VIEW (Cross-Class Teacher Timetable)

      const [selectedFacId, setSelectedFacId] = useState("");
      const [loading, setLoading] = useState(false);

      const fetchFacultyData = async () => {
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/timetable/view/faculty`);
          const data = await res.json();
          setFacultySchedules(data || []);
          if (data && data.length > 0 && !selectedFacId) {
            setSelectedFacId(data[0].faculty_id);
          }
        } catch (err) {
          showAlert("Failed to load faculty schedules", "error");
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchFacultyData();
      }, []);

      const activeFac = facultySchedules.find(f => f.faculty_id === selectedFacId) || facultySchedules[0] || null;
      const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
      const periods = [1, 2, 3, 4, 5, 6, 7];

      // Build grid for selected faculty
      const facGrid = {};

              {facultySchedules.length > 0 && (
                <div className="ml-4">
                  <select
                    value={selectedFacId}

                    className="p-2 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg text-xs font-bold text-slate-800"
                  >
                    {facultySchedules.map(f => (
                      <option key={f.faculty_id} value={f.faculty_id}>

                  </select>
                </div>
              )}

            {activeFac && (
              <div className="flex items-center space-x-2">

                <table className="w-full text-xs border-collapse">
                  <thead>
                    <tr className="bg-slate-900 text-white text-center">
                      <th className="p-3 w-28 border-r border-slate-800">Day</th>
                      {periods.map(p => (
                        <th key={p} className="p-3 border-r border-slate-800">
                          <div>Period {p}</div>
                          {p === 2 && <div className="text-[10px] text-amber-300">Recess follows</div>}

                  </thead>
                  <tbody className="divide-y divide-slate-200">
                    {days.map(day => (
                      <tr key={day} className="hover:bg-slate-50">

      const periods = [1, 2, 3, 4, 5, 6, 7];

      const handleValidate = async () => {
        if (!timetable) return;
        try {
          const res = await fetch(`${API_BASE}/timetable/validate/${timetable.id}`, { method: "POST" });
          const data = await res.json();
          setValidationModal(data);

          showAlert("Validation request failed", "error");

                onClick={() => setActiveTab("wizard")}
                className="px-5 py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow hover:bg-emerald-500 transition"
              >
                ➕ New Timetable Wizard
              </button>
            </div>
          </div>
        );
      }

      // Populate grid with entries
      const grid = {};
      days.forEach(d => { grid[d] = {}; });
      (timetable.entries || []).forEach(e => {
        if (grid[e.day]) {
          grid[e.day][e.period] = e;
        }
      });

      return (
        <div className="space-y-4">
          <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div className="flex flex-col sm:flex-row sm:items-center gap-3">
              <div>
                <h2 className="text-base font-bold text-slate-900 flex items-center space-x-2">
                  <span>{timetable.class_name}</span>
                  <span className="text-xs font-normal text-slate-500">({timetable.academic_year || "2026-27"})</span>
                </h2>
                <p className="text-xs text-slate-500">

                <span>All Class Timetables</span>

                <span>Faculty View</span>

              <button

                <span>📄</span>
                <span>Export PDF</span>
              </a>
            </div>
          </div>

          {/* Timetable Weekly Grid (Dynamic, renders all 7 periods properly) */}
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-xs border-collapse">
                <thead>
                  <tr className="bg-slate-900 text-white text-center">
                    <th className="p-3 w-28 border-r border-slate-800">Day</th>
                    <th className="p-3 border-r border-slate-800">
                      <div>Period I</div>
                      <div className="text-[10px] text-slate-400 font-normal">09:00 - 09:50</div>
                    </th>
                    <th className="p-3 border-r border-slate-800">
                      <div>Period II</div>
                      <div className="text-[10px] text-slate-400 font-normal">09:55 - 10:50</div>
                      <div className="text-[9px] text-amber-300 font-semibold">☕ Recess follows</div>
                    </th>
                    <th className="p-3 border-r border-slate-800">
                      <div>Period III</div>
                      <div className="text-[10px] text-slate-400 font-normal">11:05 - 12:00</div>
                    </th>
                    <th className="p-3 border-r border-slate-800">
                      <div>Period IV</div>
                      <div className="text-[10px] text-slate-400 font-normal">12:00 - 12:55</div>
                      <div className="text-[9px] text-amber-300 font-semibold">🍱 Lunch follows</div>
                    </th>
                    <th className="p-3 border-r border-slate-800">
                      <div>Period V</div>
                      <div className="text-[10px] text-slate-400 font-normal">01:45 - 02:35</div>
                    </th>
                    <th className="p-3 border-r border-slate-800">
                      <div>Period VI</div>
                      <div className="text-[10px] text-slate-400 font-normal">02:35 - 03:25</div>
                    </th>
                    <th className="p-3">
                      <div>Period VII</div>
                      <div className="text-[10px] text-slate-400 font-normal">03:25 - 04:15</div>
                    </th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {days.map(day => {
                    const rowCells = [];
                    let skipUntil = 0;

                    for (let p = 1; p <= 7; p++) {
                      if (p < skipUntil) {
                        // Skip rendering <td> because previous cell used colSpan
                        continue;
                      }

                      const entry = grid[day]?.[p];

                      if (entry) {
                        const isLab = entry.duration > 1 || entry.subject_type === "LAB";
                        const span = entry.duration > 1 ? entry.duration : 1;
                        if (span > 1) {
                          skipUntil = p + span;
                        }

                        rowCells.push(
                          <td
                            key={p}
                            colSpan={span}
                            className={`p-3 border-r border-slate-200 align-top transition ${
                              isLab ? "bg-amber-50/90 hover:bg-amber-100/80 border-amber-200" : "bg-blue-50/80 hover:bg-blue-100/70"
                            }`}
